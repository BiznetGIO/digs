name: CI

on: [push, pull_request]
permissions: {}

jobs:
  code_quality:
    name: Code Quality
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy, rustfmt

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: true

      # Install required tools
      - uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
      - run: mise install cargo:dprint cargo:typos-cli #  via binstall

      - name: Quality Check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: false
        run: |
          mise run lint
          mise run test:ci

  build:
    name: Build for ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # prettier-ignore
        include:
          - { build: linux-gnu, os: ubuntu-26.04, target: x86_64-unknown-linux-gnu }
          - { build: linux-musl, os: ubuntu-26.04, target: x86_64-unknown-linux-musl }
          - { build: win-gnu, os: windows-2025, target: x86_64-pc-windows-gnu }
          - { build: win-msvc, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { build: win32-msvc, os: windows-2025, target: i686-pc-windows-msvc }
          - { build: macos, os: macos-26-intel, target: x86_64-apple-darwin }

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}

      - name: Show version information
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Install dependencies
        shell: bash
        env:
          BUILD: ${{ matrix.build }}
        run: |
          if [[ "$BUILD" == *-musl ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              --allow-unauthenticated musl-tools
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
